# Cloudflare Pages: o front (dist/) e a API (functions/) num deploy só.
name = "tyranitar-capim-dourado"
compatibility_date = "2026-11-01"
pages_build_output_dir = "dist"

# Banco D1. Localmente o wrangler cria o banco em .wrangler/ (fora do Git).
# Migrations: npx wrangler d1 migrations apply tyranitar --local (ou --remote, em produção).
[[d1_databases]]
binding = "DB"
database_name = "tyranitar"
database_id = "be85546f-df5d-4364-bd06-a2acf6b3a1a2"
migrations_dir = "migrations"

# Variáveis (vão para o Cloudflare no deploy e valem no wrangler pages dev; o .dev.vars vale por
# cima delas na máquina). Modo demonstração, para o hackathon (veja o README); depois, "0" nas duas.
[vars]
# Liga POST /api/auth/demo: entrar como a cliente Ana sem senha, para a banca.
DEMO = "1"
# A Capi responde o roteiro da demonstração com as respostas salvas, sem chamar o Claude.
CAPI_MODO_DEMO = "1"
